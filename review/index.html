<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>课程幻灯片逐页审查</title>
<link rel="stylesheet" href="../dist/style.css"><link rel="stylesheet" href="../dist/vendor/katex/katex.min.css"><link rel="stylesheet" href="../dist/slides.css"><link rel="stylesheet" href="../dist/slides-redesign.css"><link rel="stylesheet" href="../dist/ui-theme.css"><link rel="stylesheet" href="../dist/slides-refined.css?v=20261010-diagrams-3">
<style>
body{margin:0;padding:18px;background:#e9eef2} .review-nav{height:38px;display:flex;align-items:center;gap:16px;font:14px Arial;color:#40586a;margin-bottom:14px}.review-nav button,.review-nav select{padding:6px 12px;font:14px Arial;border:1px solid #c8d6e0;background:white;border-radius:5px}#sheets{display:grid;grid-template-columns:repeat(3,400px);gap:16px} .review-tile{width:400px;overflow:hidden;border:1px solid #cedae3;border-radius:5px;background:white;box-shadow:0 2px 6px #203b5010} .review-label{height:24px;padding:4px 8px;font:11px/16px Arial;color:#31556f;box-sizing:border-box;background:#f5f8fa}.review-tile.lesson-slides{--slide-scale:.3125;margin:0}.review-tile .lecture-slide{height:225px}.review-tile .slide-page{top:0;transform:translateX(-50%) scale(.3125);transform-origin:top center}.review-tile .slide-prompt{pointer-events:none}#audit-scenes{position:absolute;left:-2000px;top:0;width:1280px;visibility:hidden}#audit-scenes .lesson-slides{margin:0;--slide-scale:1}#audit-scenes .lecture-slide{height:720px}#audit-scenes .slide-page{position:relative;left:0;transform:none}#summary{display:none}.review-ready{font-size:12px;color:#63808f}
</style>
<div class="review-nav"><strong>逐页审查 · 16:9 授课画面</strong><button id="prev">上一组</button><select id="batch" aria-label="选择审查组"></select><button id="next">下一组</button><span id="range"></span><span class="review-ready" id="ready">正在排版</span></div><div id="sheets"></div><div id="audit-scenes"></div><pre id="summary"></pre>
<script type="module">
import {lectureSlidesHtml} from '../dist/slides.js?v=20261010-8';
import renderMathInElement from '../dist/vendor/katex/contrib/auto-render.mjs';
const decks=await(await fetch('../dist/content/lecture-slides.json',{cache:'no-store'})).json(),all=[];
for(const [chapter,deck] of Object.entries(decks))for(const [i,slide] of deck.slides.entries())all.push({chapter,deck,page:i+1,slide});
const macros={'\\E':'\\mathbb E','\\Prob':'\\mathbb P','\\R':'\\mathbb R','\\N':'\\mathbb N','\\eps':'\\varepsilon','\\dd':'\\,\\mathrm d','\\argmin':'\\operatorname*{arg\\,min}','\\argmax':'\\operatorname*{arg\\,max}','\\abs':'\\left\\lvert #1\\right\\rvert','\\norm':'\\left\\lVert #1\\right\\rVert'};
function scene(entry){const t=document.createElement('template');t.innerHTML=lectureSlidesHtml({title:entry.deck.title,slides:[entry.slide]});const article=t.content.querySelector('article');article.dataset.chapter=entry.chapter;article.dataset.page=entry.page;article.querySelector('.slide-number').textContent=`${String(entry.page).padStart(2,'0')} / ${entry.deck.slides.length}`;return article;}
function math(root){for(const el of root.querySelectorAll('.math.display'))el.textContent='\\['+el.textContent+'\\]';renderMathInElement(root,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false,macros,strict:false});}
for(const e of all){const w=document.createElement('section');w.className='lesson-slides';w.append(scene(e));document.querySelector('#audit-scenes').append(w);}math(document.querySelector('#audit-scenes'));
const batches=Math.ceil(all.length/9),select=document.querySelector('#batch');for(let i=0;i<batches;i++)select.add(new Option(`${i+1} / ${batches}`,String(i)));
function show(i){select.value=String(Math.max(0,Math.min(batches-1,i)));i=Number(select.value);document.querySelector('#sheets').replaceChildren();for(const e of all.slice(i*9,i*9+9)){const w=document.createElement('section');w.className='review-tile lesson-slides';w.innerHTML=`<div class="review-label">${e.chapter.slice(0,2)} · ${String(e.page).padStart(2,'0')}　${e.slide.title}</div>`;w.append(scene(e));document.querySelector('#sheets').append(w);}math(document.querySelector('#sheets'));document.querySelector('#range').textContent=`第 ${i*9+1}—${Math.min(all.length,i*9+9)} 页 / ${all.length}`;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===batches-1;}
select.onchange=()=>show(Number(select.value));document.querySelector('#prev').onclick=()=>show(Number(select.value)-1);document.querySelector('#next').onclick=()=>show(Number(select.value)+1);show(0);
await document.fonts.ready;
const report=[...document.querySelectorAll('#audit-scenes article')].map(a=>{const p=a.querySelector('.slide-page'),c=a.querySelector('.slide-content'),f=a.querySelector('.slide-bottom'),pr=p.getBoundingClientRect(),cr=c.getBoundingClientRect(),fr=f.getBoundingClientRect();const nodes=[...a.querySelectorAll('.slide-narrative,.slide-support,.slide-equation,.example-formula,.slide-table-wrap,pre,h3,.slide-diagram,.diagram-node,.diagram-row-label,.diagram-matrix td')].map(n=>({type:n.className||n.tagName,width:n.clientWidth,scrollWidth:n.scrollWidth,height:n.clientHeight,scrollHeight:n.scrollHeight,top:n.getBoundingClientRect().top-pr.top,bottom:n.getBoundingClientRect().bottom-pr.top}));return{chapter:a.dataset.chapter,page:Number(a.dataset.page),title:a.querySelector('h3').textContent,layout:a.dataset.layout,pageHeight:p.scrollHeight,contentHeight:c.clientHeight,contentScroll:c.scrollHeight,footerTop:fr.top-pr.top,titleHeight:a.querySelector('h3').clientHeight,mathErrors:a.querySelectorAll('.katex-error').length,issues:nodes.filter(n=>n.scrollWidth>n.width+3||(n.type.includes('diagram-node')&&n.scrollHeight>n.height+3)||n.bottom>fr.top-pr.top+3&&n.type!=='H3'),nodes};});const expandedReport=[];for(const a of document.querySelectorAll('#audit-scenes article')){const prompt=a.querySelector('.slide-prompt');if(!prompt)continue;prompt.open=true;const c=a.querySelector('.slide-content'),p=a.querySelector('.slide-page'),f=a.querySelector('.slide-bottom');expandedReport.push({chapter:a.dataset.chapter,page:Number(a.dataset.page),pageHeight:p.scrollHeight,contentHeight:c.clientHeight,contentScroll:c.scrollHeight,promptBottom:prompt.getBoundingClientRect().bottom-p.getBoundingClientRect().top,footerTop:f.getBoundingClientRect().top-p.getBoundingClientRect().top});prompt.open=false;}const diagramIssues=[];for(const a of document.querySelectorAll('#audit-scenes article')){const canvas=a.querySelector('.diagram-canvas');if(!canvas)continue;const cr=canvas.getBoundingClientRect();const els=[...canvas.querySelectorAll('.diagram-label,.diagram-row-label,.diagram-legend,.diagram-node,.diagram-x-title,.diagram-y-title,.diagram-axis-unit')];const boxes=els.map(e=>({type:e.className,text:e.textContent,rect:e.getBoundingClientRect()}));for(const b of boxes){if(b.rect.left<cr.left-3||b.rect.right>cr.right+3||b.rect.top<cr.top-6||b.rect.bottom>cr.bottom+3)diagramIssues.push({chapter:a.dataset.chapter,page:Number(a.dataset.page),type:'outside',label:b.text});}for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a1=boxes[i],b=boxes[j];if(Math.min(a1.rect.right,b.rect.right)-Math.max(a1.rect.left,b.rect.left)>5&&Math.min(a1.rect.bottom,b.rect.bottom)-Math.max(a1.rect.top,b.rect.top)>5)diagramIssues.push({chapter:a.dataset.chapter,page:Number(a.dataset.page),type:'label-collision',a:a1.text,b:b.text});}}document.querySelector('#summary').textContent=JSON.stringify({pages:all.length,batches,report,expandedReport,diagramIssues,fonts:Array.from(document.fonts).filter(x=>x.family.includes("Song")).map(x=>({family:x.family,weight:x.weight,status:x.status})),bodyFont:getComputedStyle(document.querySelector("#audit-scenes .slide-body p")).fontFamily});document.querySelector('#ready').textContent='全部页面已渲染';
</script></html>
