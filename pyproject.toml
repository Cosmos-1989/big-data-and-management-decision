[project]
name = "bdm-decision"
version = "0.1.0"
description = "Course materials and teaching code for Big Data and Management Decision Foundations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb",
  "pandas",
  "polars",
  "numpy",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "matplotlib",
  "plotly",
  "streamlit",
  "cvxpy",
  "ortools",
  "mlflow",
  "fastapi",
  "uvicorn",
  "jupyterlab",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
